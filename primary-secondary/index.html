:root{
  color-scheme:light;
  --page:#eef0f5;--panel:#ffffff;--ink:#141a2b;--ink2:#4a5268;--ink3:#6f778c;--grid:#e3e6ee;--axis:#c3c8d4;--wash:#f5f6fa;
  --rail:#1b2440;--rail-ink:#c9d0e4;--rail-on:#ffffff;--rail-mark:#7f97e4;
  --s25:#a3abbd;--s26:#3451b2;--gain:#3451b2;--loss:#c8443a;--gain-rgb:52,81,178;--loss-rgb:200,68,58;
  --c1:#3451b2;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c3-rgb:27,175,122;--c4-rgb:237,161,0;
  --warn:#fab219;--focus:#3451b2;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --page:#0f1320;--panel:#161b28;--ink:#eef0f6;--ink2:#bcc3d6;--ink3:#8d95aa;--grid:#262d40;--axis:#3a4258;--wash:#1c2232;
  --rail:#0a0d17;--rail-ink:#aab2c8;--s25:#6b7388;--s26:#7087e0;--gain:#7087e0;--loss:#e4736a;--gain-rgb:112,135,224;--loss-rgb:228,115,106;
  --c1:#7087e0;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c3-rgb:25,158,112;--c4-rgb:201,133,0;--focus:#9eb0e8;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f1320;--panel:#161b28;--ink:#eef0f6;--ink2:#bcc3d6;--ink3:#8d95aa;--grid:#262d40;--axis:#3a4258;--wash:#1c2232;
  --rail:#0a0d17;--rail-ink:#aab2c8;--s25:#6b7388;--s26:#7087e0;--gain:#7087e0;--loss:#e4736a;--gain-rgb:112,135,224;--loss-rgb:228,115,106;
  --c1:#7087e0;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c3-rgb:25,158,112;--c4-rgb:201,133,0;--focus:#9eb0e8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 14px/1.45 "Public Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 0 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:0 20px 20px}
.brand b{display:block;color:var(--rail-on);font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12.5px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand-pick{display:block;position:relative;margin:0 0 2px -8px;max-width:calc(100% + 8px)}
.brand-pick select{appearance:none;-webkit-appearance:none;width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--rail-on);font-family:inherit;font-weight:700;font-size:18px;line-height:1.25;letter-spacing:-.01em;padding:3px 30px 3px 7px;cursor:pointer}
.brand-pick select:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}
.brand-pick select:focus-visible{outline:2px solid var(--rail-mark);outline-offset:1px}
.brand-pick::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:2px solid var(--rail-ink);border-bottom:2px solid var(--rail-ink);transform:translateY(-75%) rotate(45deg);pointer-events:none}
.brand-pick option{color:#141a2b;background:#fff;font-size:15px;font-weight:500}
.nav{display:flex;flex-direction:column}
.nav button{all:unset;cursor:pointer;padding:9px 20px 9px 17px;border-left:3px solid transparent;font-size:14px}
.nav button:hover{color:var(--rail-on);background:rgba(255,255,255,.05)}
.nav button:focus-visible{outline:2px solid var(--rail-mark);outline-offset:-2px}
.nav button[aria-current="page"]{color:var(--rail-on);font-weight:600;border-left-color:var(--rail-mark);background:rgba(255,255,255,.07)}
.rail-foot{margin-top:auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.rail-foot button{all:unset;cursor:pointer;padding:3px 0}
.rail-foot button:hover{color:var(--rail-on);text-decoration:underline}
.rail-foot button:focus-visible{outline:2px solid var(--rail-mark);outline-offset:2px}
.main{min-width:0}
.filters{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--grid);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:2px}
.filters select{min-width:100px;max-width:140px;height:30px;border:1px solid var(--axis);border-radius:4px;background:var(--panel);padding:0 6px;font-size:13px}
.filters select.on{border-color:var(--s26);box-shadow:inset 0 0 0 1px var(--s26);font-weight:600}
.reset{height:30px;border:1px solid var(--axis);border-radius:4px;background:transparent;padding:0 12px;cursor:pointer;font-size:13px}
.reset:hover{background:var(--wash)}
.scope{margin-left:auto;font-size:13px;color:var(--ink2);align-self:center;text-align:right}
.scope b{color:var(--ink);font-weight:600}
.content{padding:24px;max-width:1500px}
.sec-head{margin:0 0 18px;max-width:78ch}
.sec-head h1{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.sec-head p{color:var(--ink2);margin-top:4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:14px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.panel{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:16px 18px 14px;min-width:0;display:flex;flex-direction:column}
.p-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}

.p-kind{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--s26);margin:0 0 3px}
.hw{position:relative;display:inline-block;margin-left:7px;vertical-align:1px;text-transform:none;letter-spacing:normal}
.help{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--axis);background:var(--panel);color:var(--ink2);font-family:inherit;font-size:11px;font-weight:700;line-height:1;padding:0;cursor:help}
.help:hover,.hw.open .help{border-color:var(--s26);color:var(--s26)}
.help::before{content:"";position:absolute;inset:-8px}
.hp{display:none;position:absolute;left:-8px;top:24px;z-index:60;width:min(290px,calc(100vw - 44px));background:var(--ink);color:var(--panel);border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.45;font-weight:400;text-align:left;white-space:normal;box-shadow:0 8px 22px rgba(0,0,0,.22)}
@media (hover:hover){.hw:hover .hp{display:block}}
.hw.open .hp,.help:focus-visible+.hp{display:block}
@media print{.hw{display:none}}
.p-title{font-size:15.5px;font-weight:600;line-height:1.3;letter-spacing:-.005em;max-width:72ch}
.p-sub{font-size:12.5px;color:var(--ink2);margin-top:2px;max-width:78ch}
.p-tools{display:flex;gap:6px;flex:none;align-items:center}
.tool{border:1px solid var(--grid);background:transparent;border-radius:4px;padding:2px 8px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tool:hover{background:var(--wash);color:var(--ink)}
.note{font-size:12px;color:var(--ink3);margin-top:10px;max-width:96ch}
.chart{width:100%;min-width:0}
svg{display:block;overflow:visible}
svg text{font-family:inherit;fill:var(--ink2);font-size:12px}
svg .v{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
svg .tick{fill:var(--ink3);font-size:11px;font-variant-numeric:tabular-nums}
svg .lab{fill:var(--ink)}
svg [data-tip]{cursor:default}
svg [data-drill]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* Verdict */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px;align-items:start;margin-bottom:18px}
.verdict{font-size:29px;line-height:1.2;font-weight:600;letter-spacing:-.02em;max-width:27em}
.verdict-more{color:var(--ink2);font-size:15px;margin-top:12px;max-width:70ch}
.ledger{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:6px 14px}
.vitals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--panel);border:1px solid var(--grid);border-radius:6px;margin-bottom:14px}
.vital{padding:12px 14px;border-left:1px solid var(--grid)}
.vital:first-child{border-left:0}
.vital b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.vital>span{display:block;font-size:13px;font-weight:600;margin-top:1px}
.vital b span{font:inherit}
.vital small{display:block;font-size:12px;color:var(--ink3);line-height:1.3;margin-top:2px}
/* Tables */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--ink2);font-size:12px;text-align:left;padding:5px 8px;border-bottom:1px solid var(--axis);vertical-align:bottom;line-height:1.2;white-space:normal}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
th[aria-sort] .ar{display:inline-block;margin-left:3px;font-size:10px}
th:first-child,td:first-child{padding-left:0}
td{padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
table.dense{font-size:12.5px}table.dense td{padding:5px 6px}table.dense th{padding:5px 6px}
.tw th:first-child,.tw td:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
tbody tr:hover td:first-child{background:var(--wash)}
.heat td:first-child{background:var(--panel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr:hover td{background:var(--wash)}
tfoot td{font-weight:600;border-top:1px solid var(--ink3);border-bottom:0}
.neg{color:var(--loss)}
.dim{color:var(--ink3)}
.bar-cell{position:relative;min-width:104px}
.bar-cell i{position:absolute;left:8px;bottom:3px;height:3px;background:var(--s26);border-radius:0 2px 2px 0;opacity:.75}
.tag{display:inline-block;border-radius:3px;padding:0 5px;font-size:11.5px;background:var(--wash);border:1px solid var(--grid);color:var(--ink2);white-space:nowrap}
.tag.flag::before{content:"⚑ ";color:#b97900}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:10px}
.row label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.row select,.row input[type=search],.row input[type=number]{height:30px;border:1px solid var(--axis);border-radius:4px;background:var(--panel);padding:0 6px;font-size:13px}
.row input[type=search]{min-width:240px}
.row input[type=number]{width:96px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 11px;font-size:13px;cursor:pointer;border-left:1px solid var(--axis)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--s26);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0f1320}
.bars{display:flex;flex-direction:column;gap:9px}
.segbar-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.segbar-row>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segbar{display:flex;height:28px;gap:2px}
.segbar div{min-width:0;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.heat td{text-align:right;font-variant-numeric:tabular-nums;border-bottom:2px solid var(--panel);border-left:2px solid var(--panel)}
.heat td:first-child{text-align:left;border-left:0}
.heat th{text-align:right}.heat th:first-child{text-align:left}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:2px 10px;margin-bottom:14px;font-size:13.5px}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--s26)}
.slider b{text-align:right;font-variant-numeric:tabular-nums}
.slider small{grid-column:1/-1;color:var(--ink3);font-size:12px}
.proforma{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr) 150px minmax(0,1fr);gap:8px 16px;font-size:13.5px;margin:0}
.reads-h{font-size:14px;font-weight:600;margin-top:18px}
.reads{margin:6px 0 0;padding:0 0 0 18px;max-width:72ch;font-size:14px;color:var(--ink)}
.reads li{margin-top:5px;padding-left:2px}
.source{font-size:12px;color:var(--ink3);margin:6px 0 0}
.more-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--grid)}
.ctlbar{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.ctl .seg button{height:28px}
.fseg{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}.fseg .seg button{height:30px}
svg .flow{opacity:.38;transition:opacity .15s}svg .flow:hover{opacity:.75}
.kpi td{min-width:84px}.kpi th{white-space:normal;min-width:84px}
.dl dt{font-weight:600}.dl dd{margin:0;color:var(--ink2)}
.empty{padding:60px 20px;text-align:center;color:var(--ink2);font-size:16px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.acts b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}
.acts p{font-size:13.5px;color:var(--ink2);margin-top:2px}
.acts button{all:unset;cursor:pointer;color:var(--s26);font-size:13px;font-weight:600;margin-top:4px;display:inline-block}
.acts button:hover{text-decoration:underline}
.acts button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--panel);border-radius:4px;padding:6px 9px;font-size:12px;line-height:1.4;max-width:320px;display:none;font-variant-numeric:tabular-nums}
#tip b{display:block;font-weight:600;font-size:12.5px}
@media (max-width:1180px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}.hero{grid-template-columns:minmax(0,1fr)}.vitals{grid-template-columns:repeat(3,minmax(0,1fr))}.vital:nth-child(4){border-left:0}.vital:nth-child(n+4){border-top:1px solid var(--grid)}.acts{grid-template-columns:1fr}}
@media (max-width:1180px){.dl{grid-template-columns:150px minmax(0,1fr)}}
@media (max-width:760px){
  .dl{grid-template-columns:1fr;gap:2px 0}.dl dd{margin-bottom:8px}
  .app{display:block}
  .rail{position:static;height:auto;padding:12px 0 0}
  .brand{padding:0 16px 8px}.brand-pick{max-width:250px;margin-left:0}
  .nav{flex-direction:row;overflow-x:auto;gap:0}
  .nav button{white-space:nowrap;padding:8px 12px;border-left:0;border-bottom:3px solid transparent}
  .nav button[aria-current="page"]{border-bottom-color:var(--rail-mark)}
  .rail-foot{flex-direction:row;gap:16px;padding:8px 16px}
  .filters{position:static;padding:10px 16px}.filters label{flex:1 1 44%}.filters select{max-width:none;width:100%}
  .scope{margin-left:0;text-align:left;width:100%}
  .content{padding:16px}.verdict{font-size:23px}
  .vitals{grid-template-columns:repeat(2,minmax(0,1fr))}.vital:nth-child(odd){border-left:0}.vital:nth-child(4){border-left:1px solid var(--grid)}.vital:nth-child(n+3){border-top:1px solid var(--grid)}
  .panel{padding:14px}.p-head{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root{color-scheme:light}
  .rail,.filters .reset,.p-tools,.pager{display:none!important}
  .app{display:block}.filters{position:static}.panel{break-inside:avoid}body{background:#fff}
}
</style>
</head>

function listsFor(R) {
  const t = TH(), A = R.filter(d => d.actionable);
  const push = A.filter(d => d.gp != null && d.gp >= t.push && d.gs != null && d.gs < 0 && d.build1 > 0 && d.p1 >= t.base).sort((a, b) => b.build1 - a.build1);
  const under = A.filter(d => d.s1 >= t.base && d.s1 > Math.max(d.p1, 0) * (1 + t.gap) && (d.gs == null || d.gs >= 0)).sort((a, b) => (b.s1 - b.p1) - (a.s1 - a.p1));
  const fall = A.filter(d => d.gp != null && d.gs != null && d.gp <= -t.fall && d.gs <= -t.fall && d.p0 >= t.base).sort((a, b) => (a.p1 - a.p0) - (b.p1 - b.p0));
  const lapsed = A.filter(d => d.p0 > 0 && d.p1 <= 0).sort((a, b) => b.p0 - a.p0);
  const stopped = A.filter(d => (d.py1 > 0 || d.sy1 > 0) && d.pm1 <= 0 && d.sm1 <= 0 && (d.pm0 > 0 || d.sm0 > 0)).sort((a, b) => (b.pm0 + b.sm0) - (a.pm0 + a.sm0));
  return {push, under, fall, lapsed, stopped};
}
const pools = l => ({push: l.push.reduce((s, d) => s + d.build1, 0), under: l.under.reduce((s, d) => s + d.s1 - Math.max(d.p1, 0), 0), lapsed: l.lapsed.reduce((s, d) => s + d.p0, 0)});

  const list = (state.topN ? ranked.slice(0, state.topN) : ranked).map((x, i) => ({...x[0], rank: i + 1})); let cum = 0; list.forEach(d => { d.sh = T.v1 > 0 ? d.v1 / T.v1 : 0; cum += d.sh; d.cum = cum; });

function healthIndex(rows) {
  const f = rows.filter(r => r.gp != null && r.gs != null && r.ratio1 != null);
  const pr = (a, v) => a.length < 2 ? 1 : a.filter(x => x < v).length / (a.length - 1);
  const K = [r => r.gp, r => r.gs, r => -Math.abs(Math.log(r.ratio1)), r => r.perDealer], m = K.map(k => f.map(k));
  f.forEach(r => { r.health = K.reduce((s, k, i) => s + pr(m[i], k(r)), 0) / 4 * 100; });
  f.sort((a, b) => b.health - a.health).forEach((r, i) => r.healthRank = i + 1);
}

}

/* ---------- shell ---------- */
function renderFilters(R, T) {
  const form = document.getElementById('filters');
  const opts = k => [['', 'All'], ...[...new Set(DEALERS.filter(d => pass(d, k)).map(d => d[k]))].sort((a, b) => k === 'quad' ? QUADS.indexOf(a) - QUADS.indexOf(b) : String(a).localeCompare(String(b))).map(v => [v, v])];
  const active = FILTERS.some(([k]) => state.f[k]);
  const seg = (id, label, items, cur) => `<div class="fseg"><span>${label}</span><div class="seg" role="group" aria-label="${label}">${items.map(([k, l]) => `<button type="button" data-${id}="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div></div>`;
  form.innerHTML = seg('m', 'Measure', [['p', 'Primary'], ['s', 'Secondary']], state.m) + seg('per', 'Period', [['ytd', 'YTD Oct'], ['oct', 'October']], state.per)
    + FILTERS.map(([k, l]) => `<label>${l}<select data-f="${k}" class="${state.f[k] ? 'on' : ''}">${opts(k).map(([v, t]) => `<option value="${esc(v)}" ${String(state.f[k]) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`).join('')
    + (active ? `<button type="button" class="reset" id="reset">Reset filters</button>` : '') + `<div class="scope" role="status"><b>${num(T.n)}</b> dealers, <b>${money(T.p1)}</b> primary, <b>${money(T.s1)}</b> secondary</div>`;
  form.querySelectorAll('select').forEach(s => s.onchange = () => { state.f[s.dataset.f] = s.value; render(); });
  form.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { state.m = b.dataset.m; prep(); render(); });
  form.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { state.per = b.dataset.per; prep(); render(); });
  const rs = form.querySelector('#reset'); if (rs) rs.onclick = () => { state.f = emptyF(); render(); };
}
function renderNav() {
  document.getElementById('nav').innerHTML = SECTIONS.map(([k, l]) => `<button type="button" data-sec="${k}" ${state.section === k ? 'aria-current="page"' : ''}>${esc(l)}</button>`).join('');
  document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => go(b.dataset.sec));
}
function render() {
  charts.clear(); tables.clear(); uid = 0;
  const R = view(), T = roll(R), K = concentration(R);
  renderNav(); renderFilters(R, T);
  const el = document.getElementById('content'), s = state.section;
  if (!R.length && s !== 'notes') { el.innerHTML = `<div class="empty">No dealers match these filters. Select Reset filters to see all dealers.</div>`; return; }
  el.innerHTML = s === 'summary' ? renderSummary(R, T, K) : s === 'charts' ? renderCharts(R, T, K) : s === 'sell' ? renderSell(R, T) : s === 'momentum' ? renderMomentum(R, T) : s === 'dealers' ? renderDealers(R, T, K) : s === 'team' ? renderTeam(R, T) : s === 'geo' ? renderGeo(R, T) : s === 'actions' ? renderActions(R, T) : s === 'all' ? renderAll(R) : renderNotes();
  el.insertAdjacentHTML('beforeend', `<p class="source">Source: Summary_ Primary Vs Secondary Sales_YTD Oct'26.xlsx, ${num(PAYLOAD.info.source_rows)} rows, ${num(BASE.length)} dealers after combining shared S4 HANA codes. Quantities in mtrs. Showing ${MW()}, ${PER()}. Built 11 November 2026.</p>`);
  mount(); wire();
  window.__metrics = {T, K, section: s};
}
function wire() {
  const on = (id, fn) => { const e = document.getElementById(id); if (e) fn(e); };
  on('topN', e => e.onchange = () => { state.topN = +e.value; render(); });
  on('topBy', e => e.onchange = () => { state.topBy = e.value; render(); });
  on('cityN', e => e.onchange = () => { state.cityN = +e.value; render(); });
  on('cd', e => e.onchange = () => { state.cd = e.value; render(); });
  on('cn', e => e.onchange = () => { state.cn = +e.value; render(); });
  on('st', e => e.onchange = () => { state.st = e.value; render(); });
  on('q', e => e.oninput = () => { state.q = e.value; const pos = e.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
  document.querySelectorAll('[data-listtab]').forEach(b => b.onclick = () => { state.list = b.dataset.listtab; render(); });
  document.querySelectorAll('[data-list]').forEach(b => b.onclick = () => { state.list = b.dataset.list; go('actions'); });
  document.querySelectorAll('[data-lv]').forEach(i => { i.onchange = () => { state.lv[i.dataset.lv] = +i.value; render(); }; i.oninput = () => { const o = document.getElementById('lv-' + i.dataset.lv); if (o) o.textContent = i.value + '%'; }; });
  document.querySelectorAll('[data-th]').forEach(i => i.onchange = () => { const v = +i.value; if (!isFinite(v) || v < 0) return; TH()[i.dataset.th] = i.dataset.pct ? v / 100 : v; render(); });
  document.querySelectorAll('[data-twin]').forEach(b => b.onclick = () => { const p = b.dataset.twin, a = document.getElementById(p + 'a'), t = document.getElementById(p + 'b'); const showTable = t.hidden; t.hidden = !showTable; a.hidden = showTable; b.textContent = showTable ? 'Show chart' : 'Show table'; b.setAttribute('aria-expanded', String(showTable)); if (!showTable) mount(); });
}
document.addEventListener('click', e => { const t = e.target.closest('[data-drill]'); if (t) { const [k, v] = t.dataset.drill.split('|'); if (v && k in state.f) { state.f[k] = String(state.f[k]) === String(v) ? '' : v; render(); } } });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-drill]')) { e.preventDefault(); e.target.click(); } });
const closeHelp = keep => document.querySelectorAll('.hw.open').forEach(w => { if (w !== keep) { w.classList.remove('open'); w.querySelector('.help').setAttribute('aria-expanded', 'false'); } });
document.addEventListener('click', e => { const b = e.target.closest?.('.help'); if (b) { e.preventDefault(); const w = b.parentElement, on = !w.classList.contains('open'); closeHelp(w); w.classList.toggle('open', on); b.setAttribute('aria-expanded', String(on)); return; } if (!e.target.closest?.('.hp')) closeHelp(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHelp(); });
const tip = document.getElementById('tip');
function showTip(t, x, y) { const lines = t.dataset.tip.split('|').filter(Boolean); tip.textContent = ''; lines.forEach((l, i) => { const n = document.createElement(i ? 'div' : 'b'); n.textContent = l; tip.appendChild(n); }); tip.style.display = 'block'; const r = tip.getBoundingClientRect(); tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + 'px'; tip.style.top = (y + r.height + 20 > innerHeight ? y - r.height - 10 : y + 14) + 'px'; }
document.addEventListener('mousemove', e => { const t = e.target.closest?.('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else tip.style.display = 'none'; });
document.addEventListener('focusin', e => { const t = e.target.closest?.('[data-tip]'); if (t) { const r = t.getBoundingClientRect(); showTip(t, r.right, r.top); } });
document.addEventListener('focusout', () => { tip.style.display = 'none'; });
document.addEventListener('touchstart', e => { const t = e.target.closest?.('[data-tip]'), p = e.touches[0]; if (t && p) showTip(t, p.clientX, p.clientY); else tip.style.display = 'none'; }, {passive: true});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { document.querySelectorAll('[data-c]').forEach(el => { const w = el.clientWidth; if (w > 0) el.innerHTML = charts.get(el.dataset.c)(w); }); fitSegLabels(); }, 120); });
const themeBtn = document.getElementById('theme');
const isDark = () => { const a = document.documentElement.dataset.theme; return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const labelTheme = () => themeBtn.textContent = isDark() ? 'Switch to light theme' : 'Switch to dark theme';
themeBtn.onclick = () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('ps-theme', next); } catch (e) {} labelTheme(); render(); };
try { const s = localStorage.getItem('ps-theme'); if (s) document.documentElement.dataset.theme = s; } catch (e) {}
labelTheme();
document.getElementById('print').onclick = () => window.print();
const hashSec = (location.hash || '').slice(1); if (SECTIONS.some(s => s[0] === hashSec)) state.section = hashSec;
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (SECTIONS.some(s => s[0] === h) && h !== state.section) { state.section = h; render(); } });
prep(); render();
document.fonts?.ready.then(() => render());

</script>
