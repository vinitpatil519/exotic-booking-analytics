:root{
  color-scheme:light;
  --page:#eef0f5;--panel:#ffffff;--ink:#141a2b;--ink2:#4a5268;--ink3:#6f778c;--grid:#e3e6ee;--axis:#c3c8d4;--wash:#f5f6fa;
  --rail:#1b2440;--rail-ink:#c9d0e4;--rail-on:#ffffff;--rail-mark:#7f97e4;
  --s25:#a3abbd;--s26:#3451b2;--gain:#3451b2;--loss:#c8443a;--gain-rgb:52,81,178;--loss-rgb:200,68,58;
  --c1:#3451b2;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;
  --warn:#fab219;--focus:#3451b2;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --page:#0f1320;--panel:#161b28;--ink:#eef0f6;--ink2:#bcc3d6;--ink3:#8d95aa;--grid:#262d40;--axis:#3a4258;--wash:#1c2232;
  --rail:#0a0d17;--rail-ink:#aab2c8;--s25:#6b7388;--s26:#7087e0;--gain:#7087e0;--loss:#e4736a;--gain-rgb:112,135,224;--loss-rgb:228,115,106;
  --c1:#7087e0;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--focus:#9eb0e8;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f1320;--panel:#161b28;--ink:#eef0f6;--ink2:#bcc3d6;--ink3:#8d95aa;--grid:#262d40;--axis:#3a4258;--wash:#1c2232;
  --rail:#0a0d17;--rail-ink:#aab2c8;--s25:#6b7388;--s26:#7087e0;--gain:#7087e0;--loss:#e4736a;--gain-rgb:112,135,224;--loss-rgb:228,115,106;
  --c1:#7087e0;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--focus:#9eb0e8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 14px/1.45 "Public Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 0 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:0 20px 20px}
.brand b{display:block;color:var(--rail-on);font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12.5px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand-pick{display:block;position:relative;margin:0 0 2px -8px;max-width:calc(100% + 8px)}
.brand-pick select{appearance:none;-webkit-appearance:none;width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--rail-on);font-family:inherit;font-weight:700;font-size:18px;line-height:1.25;letter-spacing:-.01em;padding:3px 30px 3px 7px;cursor:pointer}
.brand-pick select:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}
.brand-pick select:focus-visible{outline:2px solid var(--rail-mark);outline-offset:1px}
.brand-pick::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:2px solid var(--rail-ink);border-bottom:2px solid var(--rail-ink);transform:translateY(-75%) rotate(45deg);pointer-events:none}
.brand-pick option{color:#141a2b;background:#fff;font-size:15px;font-weight:500}
.nav{display:flex;flex-direction:column}
.nav button{all:unset;cursor:pointer;padding:9px 20px 9px 17px;border-left:3px solid transparent;font-size:14px}
.nav button:hover{color:var(--rail-on);background:rgba(255,255,255,.05)}
.nav button:focus-visible{outline:2px solid var(--rail-mark);outline-offset:-2px}
.nav button[aria-current="page"]{color:var(--rail-on);font-weight:600;border-left-color:var(--rail-mark);background:rgba(255,255,255,.07)}
.rail-foot{margin-top:auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.rail-foot button{all:unset;cursor:pointer;padding:3px 0}
.rail-foot button:hover{color:var(--rail-on);text-decoration:underline}
.rail-foot button:focus-visible{outline:2px solid var(--rail-mark);outline-offset:2px}
.main{min-width:0}
.filters{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--grid);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:2px}
.filters select{min-width:100px;max-width:140px;height:30px;border:1px solid var(--axis);border-radius:4px;background:var(--panel);padding:0 6px;font-size:13px}
.filters select.on{border-color:var(--s26);box-shadow:inset 0 0 0 1px var(--s26);font-weight:600}
.reset{height:30px;border:1px solid var(--axis);border-radius:4px;background:transparent;padding:0 12px;cursor:pointer;font-size:13px}
.reset:hover{background:var(--wash)}
.scope{margin-left:auto;font-size:13px;color:var(--ink2);align-self:center;text-align:right}
.scope b{color:var(--ink);font-weight:600}
.content{padding:24px;max-width:1500px}
.sec-head{margin:0 0 18px;max-width:78ch}
.sec-head h1{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.sec-head p{color:var(--ink2);margin-top:4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:14px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.panel{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:16px 18px 14px;min-width:0;display:flex;flex-direction:column}
.p-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}

.p-kind{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--s26);margin:0 0 3px}
.hw{position:relative;display:inline-block;margin-left:7px;vertical-align:1px;text-transform:none;letter-spacing:normal}
.help{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--axis);background:var(--panel);color:var(--ink2);font-family:inherit;font-size:11px;font-weight:700;line-height:1;padding:0;cursor:help}
.help:hover,.hw.open .help{border-color:var(--s26);color:var(--s26)}
.help::before{content:"";position:absolute;inset:-8px}
.hp{display:none;position:absolute;left:-8px;top:24px;z-index:60;width:min(290px,calc(100vw - 44px));background:var(--ink);color:var(--panel);border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.45;font-weight:400;text-align:left;white-space:normal;box-shadow:0 8px 22px rgba(0,0,0,.22)}
@media (hover:hover){.hw:hover .hp{display:block}}
.hw.open .hp,.help:focus-visible+.hp{display:block}
@media print{.hw{display:none}}
.p-title{font-size:15.5px;font-weight:600;line-height:1.3;letter-spacing:-.005em;max-width:72ch}
.p-sub{font-size:12.5px;color:var(--ink2);margin-top:2px;max-width:78ch}
.p-tools{display:flex;gap:6px;flex:none;align-items:center}
.tool{border:1px solid var(--grid);background:transparent;border-radius:4px;padding:2px 8px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tool:hover{background:var(--wash);color:var(--ink)}
.note{font-size:12px;color:var(--ink3);margin-top:10px;max-width:96ch}
.chart{width:100%;min-width:0}
svg{display:block;overflow:visible}
svg text{font-family:inherit;fill:var(--ink2);font-size:12px}
svg .v{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
svg .tick{fill:var(--ink3);font-size:11px;font-variant-numeric:tabular-nums}
svg .lab{fill:var(--ink)}
svg [data-tip]{cursor:default}
svg [data-drill]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* Verdict */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px;align-items:start;margin-bottom:18px}
.verdict{font-size:29px;line-height:1.2;font-weight:600;letter-spacing:-.02em;max-width:27em}
.verdict-more{color:var(--ink2);font-size:15px;margin-top:12px;max-width:70ch}
.ledger{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:6px 14px}
.vitals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--panel);border:1px solid var(--grid);border-radius:6px;margin-bottom:14px}
.vital{padding:12px 14px;border-left:1px solid var(--grid)}
.vital:first-child{border-left:0}
.vital b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.vital>span{display:block;font-size:13px;font-weight:600;margin-top:1px}
.vital b span{font:inherit}
.vital small{display:block;font-size:12px;color:var(--ink3);line-height:1.3;margin-top:2px}
/* Tables */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--ink2);font-size:12px;text-align:left;padding:5px 8px;border-bottom:1px solid var(--axis);vertical-align:bottom;line-height:1.2;white-space:normal}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
th[aria-sort] .ar{display:inline-block;margin-left:3px;font-size:10px}
th:first-child,td:first-child{padding-left:0}
td{padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
table.dense{font-size:12.5px}table.dense td{padding:5px 6px}table.dense th{padding:5px 6px}
.tw th:first-child,.tw td:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
tbody tr:hover td:first-child{background:var(--wash)}
.heat td:first-child{background:var(--panel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr:hover td{background:var(--wash)}
tfoot td{font-weight:600;border-top:1px solid var(--ink3);border-bottom:0}
.neg{color:var(--loss)}
.dim{color:var(--ink3)}
.bar-cell{position:relative;min-width:104px}
.bar-cell i{position:absolute;left:8px;bottom:3px;height:3px;background:var(--s26);border-radius:0 2px 2px 0;opacity:.75}
.tag{display:inline-block;border-radius:3px;padding:0 5px;font-size:11.5px;background:var(--wash);border:1px solid var(--grid);color:var(--ink2);white-space:nowrap}
.tag.flag::before{content:"⚑ ";color:#b97900}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:10px}
.row label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.row select,.row input[type=search],.row input[type=number]{height:30px;border:1px solid var(--axis);border-radius:4px;background:var(--panel);padding:0 6px;font-size:13px}
.row input[type=search]{min-width:240px}
.row input[type=number]{width:96px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 11px;font-size:13px;cursor:pointer;border-left:1px solid var(--axis)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--s26);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0f1320}
.bars{display:flex;flex-direction:column;gap:9px}
.segbar-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.segbar-row>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segbar{display:flex;height:28px;gap:2px}
.segbar div{min-width:0;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.heat td{text-align:right;font-variant-numeric:tabular-nums;border-bottom:2px solid var(--panel);border-left:2px solid var(--panel)}
.heat td:first-child{text-align:left;border-left:0}
.heat th{text-align:right}.heat th:first-child{text-align:left}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:2px 10px;margin-bottom:14px;font-size:13.5px}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--s26)}
.slider b{text-align:right;font-variant-numeric:tabular-nums}
.slider small{grid-column:1/-1;color:var(--ink3);font-size:12px}
.proforma{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr) 150px minmax(0,1fr);gap:8px 16px;font-size:13.5px;margin:0}
.reads-h{font-size:14px;font-weight:600;margin-top:18px}
.reads{margin:6px 0 0;padding:0 0 0 18px;max-width:72ch;font-size:14px;color:var(--ink)}
.reads li{margin-top:5px;padding-left:2px}
.source{font-size:12px;color:var(--ink3);margin:6px 0 0}
.more-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--grid)}
.ctlbar{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.ctl .seg button{height:28px}
svg .flow{opacity:.38;transition:opacity .15s}svg .flow:hover{opacity:.75}
.kpi td{min-width:84px}.kpi th{white-space:normal;min-width:84px}
.dl dt{font-weight:600}.dl dd{margin:0;color:var(--ink2)}
.empty{padding:60px 20px;text-align:center;color:var(--ink2);font-size:16px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.acts b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}
.acts p{font-size:13.5px;color:var(--ink2);margin-top:2px}
.acts button{all:unset;cursor:pointer;color:var(--s26);font-size:13px;font-weight:600;margin-top:4px;display:inline-block}
.acts button:hover{text-decoration:underline}
.acts button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--panel);border-radius:4px;padding:6px 9px;font-size:12px;line-height:1.4;max-width:320px;display:none;font-variant-numeric:tabular-nums}
#tip b{display:block;font-weight:600;font-size:12.5px}
@media (max-width:1180px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}.hero{grid-template-columns:minmax(0,1fr)}.vitals{grid-template-columns:repeat(3,minmax(0,1fr))}.vital:nth-child(4){border-left:0}.vital:nth-child(n+4){border-top:1px solid var(--grid)}.acts{grid-template-columns:1fr}}
@media (max-width:1180px){.dl{grid-template-columns:150px minmax(0,1fr)}}
@media (max-width:760px){
  .dl{grid-template-columns:1fr;gap:2px 0}.dl dd{margin-bottom:8px}
  .app{display:block}
  .rail{position:static;height:auto;padding:12px 0 0}
  .brand{padding:0 16px 8px}.brand-pick{max-width:250px;margin-left:0}
  .nav{flex-direction:row;overflow-x:auto;gap:0}
  .nav button{white-space:nowrap;padding:8px 12px;border-left:0;border-bottom:3px solid transparent}
  .nav button[aria-current="page"]{border-bottom-color:var(--rail-mark)}
  .rail-foot{flex-direction:row;gap:16px;padding:8px 16px}
  .filters{position:static;padding:10px 16px}.filters label{flex:1 1 44%}.filters select{max-width:none;width:100%}
  .scope{margin-left:0;text-align:left;width:100%}
  .content{padding:16px}.verdict{font-size:23px}
  .vitals{grid-template-columns:repeat(2,minmax(0,1fr))}.vital:nth-child(odd){border-left:0}.vital:nth-child(4){border-left:1px solid var(--grid)}.vital:nth-child(n+3){border-top:1px solid var(--grid)}
  .panel{padding:14px}.p-head{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root{color-scheme:light}
  .rail,.filters .reset,.p-tools,.pager{display:none!important}
  .app{display:block}.filters{position:static}.panel{break-inside:avoid}body{background:#fff}
}
</style>

function roll(rows) {

    else if (d.status === 'Lost') { o.lost++; o.lostV += d.v25; } else { o.neu++; o.newV += d.v26; }

  }
  o.dv = o.v26 - o.v25; o.g = o.v25 > 0 ? o.v26 / o.v25 - 1 : null;
  o.a25 = o.q25 > 0 ? o.r25 / o.q25 : null; o.a26 = o.q26 > 0 ? o.r26 / o.q26 : null; o.da = o.a25 && o.a26 ? o.a26 / o.a25 - 1 : null;
  o.logo = o.act25 ? o.cont / o.act25 : null; o.lfl = o.c25 > 0 ? o.c26 / o.c25 - 1 : null; o.nrr = o.v25 > 0 ? o.c26 / o.v25 : null; o.grr = o.v25 > 0 ? o.minv / o.v25 : null;

function groupBy(rows, key) { const m = new Map(); for (const d of rows) { const k = typeof key === 'function' ? key(d) : d[key]; if (!m.has(k)) m.set(k, []); m.get(k).push(d); } return m; }

function spearman(xs, ys) {
  const rank = v => { const idx = v.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]), r = new Array(v.length); let i = 0;
    while (i < idx.length) { let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++; for (let k = i; k <= j; k++) r[idx[k][1]] = (i + j) / 2 + 1; i = j + 1; } return r; };

const HELP = {"Bridge chart": "Starts at the SS25 total and ends at the SS26 total. Each bar in between shows how much lost, declining, growing and new dealers took away or added.","Price and volume bridge": "Splits the change at dealers who booked in both seasons into volume (more or fewer mtrs) and rate (price and product mix). Lost and new dealers are shown separately.","Contribution to growth": "How many percentage points each group added to, or took away from, total growth. Added together, the bars equal total growth.","Channel mix shift": "Share of the total by channel, SS25 against SS26. Shows which channels gained or lost share of the business.","Action summary": "Three pools of trade dealers to act on first: lost dealers to win back, dealers that fell sharply, and dealers priced well below their channel.","Top dealers table": "Dealers ranked by the measure you choose. Share and cumulative share show how much of the total each dealer, and the list so far, books.","Concentration table": "How much of the total the top 1, 5, 10 and more dealers book, this season against last. HHI and Gini sum up how concentrated the business is.","Concentration curve (Lorenz)": "Dealers sorted from largest to smallest. The curve shows what share of the total the top x% of dealers book. Further from the diagonal means more concentrated.","Decile table": "Active dealers split into ten equal-sized groups by SS26, largest first. Shows how much each tenth of the dealer base books.","ABC classes": "A dealers make the first 80% of SS26, B the next 15% and C the last 5%. The columns below count dealers in each size band per season.","Size-band movement matrix": "Rows are each dealer's SS25 size band and columns its SS26 band. Each cell counts dealers, so the diagonal is dealers who stayed in their band.","Same-name groups": "Dealer codes that share a name, grouped together. The file has no parent code, so treat these as possible chains to confirm.","ZM scorecard": "One row per zone manager with size, growth, retention and price. Select a row to filter the whole site.", "National head scorecard": "One row per national head with size, growth, retention and price. Select a row to filter the whole site.","RSM scorecard": "One row per RSM with size, growth, retention and price. Select a row to filter the whole site.","ASM territory map": "Each dot is an ASM. Further right is a bigger territory, higher up is stronger like-for-like growth. The lines mark the middle ASM.","ASM movers": "The ASMs that added or took away the most points of total growth. Blue added, red took away.","ASM scorecard and health index": "Every ASM with its measures. The health index averages each ASM's rank on growth, retention, size per dealer and ASP.","Sales group scorecard": "Every sales group with its size, growth and retention, plus its largest cities.","State comparison": "SS25 against SS26 for the 12 largest states. Grey is last season and blue is this season.","State movers": "The states that added or took away the most points of total growth.","State scorecard": "Every state with size, growth, retention and price. State comes from city and sales group, so treat it as indicative.","City table": "Cities ranked by SS26, with growth, retention and how much the largest dealer books in each city.","RSM by channel heatmap": "Each cell is one RSM in one channel. The buttons switch the cells between size, growth, dealer count and ASP.","One-dealer cities": "Cities where a single dealer books more than half of the total. Losing that one dealer would hit the city hard.","State by channel heatmap": "Each cell is one of the 15 largest states in one channel. It uses the same measure buttons as the RSM heatmap.","Cities started and stopped": "Cities that booked last season but not this one, and cities that are new this season.","Channel scorecard": "Each channel's size, growth, lost and new business, like-for-like change and ASP. ASP is ₹ per mtr.","ASP by channel": "Average ₹ per mt   members(R, dim, T) { return rollup(R, dim, T).map(g => ({...g, key: g.label, label: dimLabel(dim, g.label)})); },
  growthDist(R) {
    const isC = d => d.status === 'Continuing';
    const B = [['Lost', d => d.status === 'Lost', 'var(--loss)'], ['Fell 50% or more', d => isC(d) && d.g <= -.5, 'var(--loss)'], ['Fell 25% to 50%', d => isC(d) && d.g > -.5 && d.g <= -.25, 'var(--loss)'], ['Fell 5% to 25%', d => isC(d) && d.g > -.25 && d.g < -.05, 'var(--loss)'],
      ['Flat, within ±5%', d => isC(d) && d.g >= -.05 && d.g <= .05, 'var(--s25)'], ['Grew 5% to 25%', d => isC(d) && d.g > .05 && d.g <= .25, 'var(--gain)'], ['Grew 25% to 50%', d => isC(d) && d.g > .25 && d.g <= .5, 'var(--gain)'], ['Grew 50% to 100%', d => isC(d) && d.g > .5 && d.g <= 1, 'var(--gain)'], ['Grew over 100%', d => isC(d) && d.g > 1, 'var(--gain)'], ['New', d => d.status === 'New', 'var(--c3)']];
    return B.map(([label, f, c]) => { const g = R.filter(f); return {label, c, n: g.length, dv: g.reduce((s, d) => s + d.dv, 0), share: R.length ? g.length / R.length : 0}; });
  },
  bandKeep(R) { return BANDS.map(b => b[1]).map(b => { const g = R.filter(d => d.b25 === b); if (!g.length) return null;
    const base = g.reduce((s, d) => s + d.v25, 0), kept = g.reduce((s, d) => s + d.minv, 0), lost = g.filter(d => d.status === 'Lost').reduce((s, d) => s + d.v25, 0);
    return {label: b, n: g.length, base, kept, lost, decl: base - kept - lost, keptSh: base ? kept / base : null}; }).filter(Boolean); },
  flow(R) { const c = R.filter(d => d.status === 'Continuing'), grew = c.filter(d => d.g > .05).length, fell = c.filter(d => d.g < -.05).length, flat = c.length - grew - fell, lost = R.filter(d => d.status === 'Lost').length, neu = R.filter(d => d.status === 'New').length;
    return {grew, flat, fell, lost, neu, act25: c.length + lost, act26: c.length + neu}; },
  aspSpread(R, dim) { return [...groupBy(R.filter(d => d.v26 > 0 && d.a26 != null), dim)].map(([k, g]) => { const s = g.map(d => d.a26).sort((x, y) => x - y), s25 = R.filter(d => d[dim] === k && d.v25 > 0 && d.a25 != null).map(d => d.a25).sort((x, y) => x - y);
    return {key: k, label: dimLabel(dim, k), n: s.length, v26: g.reduce((p, d) => p + d.v26, 0), q: s.length >= 5 ? [.1, .25, .5, .75, .9].map(p => quant(s, p)) : null, m25: s25.length >= 5 ? quant(s25, .5) : null}; }).sort((a, b) => b.v26 - a.v26); },
};

const P = {
  growthDist(R, {span = 5, what = 'dealers'} = {}) {
    const b = CX.growthDist(R), cont = R.filter(d => d.status === 'Continuing').length, grew = b.slice(5, 9).reduce((s, x) => s + x.n, 0), fell = b.slice(1, 4).reduce((s, x) => s + x.n, 0);
    const rows = b.map(x => ({label: x.label, v: x.n, c: x.c, vt: `${num(x.n)} · ${pct(x.share, 0)}`, tip: [x.label, plural(x.n, 'dealer') + `, ${pct(x.share)} of ${what}`, `Net change: ${sMoney(x.dv)}`]}));
    return panel({kind: 'Growth spread', span, title: cont ? `${num(grew)} of ${num(cont)} continuing dealers grew more than 5% and ${num(fell)} fell more than 5%` : 'Dealer growth spread', sub: `Dealers grouped by change in ${MW()} against SS25. Bar length is the dealer count. Hover for the net ${MW()} change of each group.`, body: chart(w => hbars(w, rows, {labelW: Math.min(w * .4, 150)})), twin: {cols: [C.text('Group', 'label', {nosort: 1}), C.int('Dealers', 'n', {nosort: 1}), C.pct('Share of dealers', 'share', {nosort: 1}), C.lakh('Net change ₹ L', 'dv', {nosort: 1})], rows: b}});
  },
  treemap(R, T, dim, {span = 7, H = 340} = {}) {
    const m = CX.members(R, dim, T), top = m[0]; if (!top) return '';
    return panel({kind: 'Treemap', span, title: `${esc(top.label)} is the largest ${esc(dimName(dim))} at ${pct(top.share)} of SS26 ${MW()}`, sub: `Every ${esc(dimName(dim))}, sized by SS26 ${MW()} and coloured by growth. Select a box to filter.`, body: treemapKey + chart(w => treemap(w, m.map(g => ({key: g.key, label: g.label, v: g.v26, v25: g.v25, g: g.g})), {H, dim})), twin: {cols: [C.text(dimName(dim), 'label'), C.lakh('SS25 ₹ L', 'v25'), C.lakh('SS26 ₹ L', 'v26', {bar: 1}), C.pct('Share', 'share'), C.pct('Growth', 'g')], rows: m}});
  },
  contrib(R, T, dim, {span = 5, n = 12} = {}) {
    const m = CX.members(R, dim, T).filter(g => g.cpp != null); if (m.length < 2) return '';
    const pick = m.slice().sort((a, b) => Math.abs(b.dv) - Math.abs(a.dv)).slice(0, n).sort((a, b) => b.cpp - a.cpp), best = pick[0], worst = pick[pick.length - 1], drill = dim;
    return panel({kind: 'Contribution to growth', span, title: `${esc(best.label)} ${best.cpp >= 0 ? 'added' : 'took away'} ${num(Math.abs(best.cpp), 2)} points of growth. ${esc(worst.label)} ${worst.cpp < 0 ? 'took away' : 'added'} ${num(Math.abs(worst.cpp), 2)}`, sub: `Contribution to total growth of ${sPct(T.g)}, in percentage points. ${pick.length < m.length ? `The ${num(pick.length)} largest moves of ${num(m.length)}.` : ''} Hover for the ${MW()} change.`, body: chart(w => divBars(w, pick.map(g => ({label: drill ? g.key : g.label, v: g.cpp, tip: `${sMoney(g.dv)}, ${sPct(g.g)} growth`})), {dim: drill})), twin: {cols: [C.text(dimName(dim), 'label'), C.pts('Contribution pts', 'cpp'), C.lakh('Change ₹ L', 'dv'), C.pct('Growth', 'g')], rows: pick}});
  },
  matrix(R, T, dim, {span = 7, labels = 10} = {}) {
    const m = CX.members(R, dim, T), pts_ = m.filter(g => g.g != null && g.v26 > 0); if (pts_.length < 3) return '';
    const avg = 1 / m.filter(g => g.v26 > 0).length, gs = pts_.map(g => g.g), ylo = Math.max(-1, Math.floor(Math.min(...gs, T.g ?? 0, 0) * 10) / 10), yhi = Math.min(1.5, Math.ceil(Math.max(...gs, T.g ?? 0, 0) * 10) / 10);
    const xt = ticks(0, Math.max(...pts_.map(g => g.share)) * 1.06, 5), x1 = xt[xt.length - 1], mx = Math.max(...pts_.map(g => g.v26));
    const lead = pts_.filter(g => g.share > avg && g.g > T.g).length, capped = pts_.filter(g => g.g > yhi || g.g < ylo).length, fresh = m.length - pts_.length;
    return panel({kind: 'Share vs growth matrix', span, title: `${num(lead)} of ${num(pts_.length)} ${esc(dimName(dim))}s are above average size and growing faster than the total`, sub: `Share of SS26 ${MW()} against growth. Bubble size is SS26 ${MW()}. Lines mark the average share and the total growth of ${sPct(T.g)}.${capped ? ` ${num(capped)} capped at the chart edge.` : ''}${fresh ? ` ${num(fresh)} with no SS25 booking left out.` : ''}`,
      body: chart(w => scatter(w, pts_.map(g => ({x: g.share, y: g.g, label: g.key, r: 3 + 13 * Math.sqrt(g.v26 / mx), op: .55, c: g.g >= 0 ? 'var(--gain)' : 'var(--loss)', tip: [g.label, `SS26 ${money(g.v26)}, ${pct(g.share)} share`, `Growth ${sPct(g.g)}`, `${plural(g.act26, 'active dealer')}`]})), {x0: 0, x1, y0: ylo, y1: yhi, xt, yt: ticks(ylo, yhi, 6), xf: v => pct(v, 0), yf: v => pct(v, 0), xTitle: `Share of SS26 ${MW()}`, yTitle: 'Growth against SS25', xRef: avg, yRef: T.g, H: 340, dim, aria: 'Share against growth', labels: m.filter(g => g.g != null && g.v26 > 0).slice(0, labels).map(g => ({x: g.share, y: g.g, label: g.label})), corners: [{x: 'r', y: 't', t: 'Large, growing fast'}, {x: 'l', y: 't', t: 'Small, growing fast'}, {x: 'r', y: 'b', t: 'Large, lagging'}, {x: 'l', y: 'b', t: 'Small, lagging'}]}))});
  },
  slope(R, T, dim, {span = 5, n = 12} = {}) {
    const allM = CX.members(R, dim, T), m = allM.slice(0, n); if (m.length < 2) return '';
    const rows = m.map(g => ({key: g.key, label: g.label, a: g.v25, b: g.v26}));

  pareto(R, {span = 6, vals, unit = 'dealers', title, sub} = {}) {

  bandKeep(R, {span = 7} = {}) {

    const s = b.filter(x => x.keptSh != null).slice().sort((x, y) => y.keptSh - x.keptSh), hi = s[0], lo = s[s.length - 1], u = QTY ? ' mtrs' : '';
    const parts = b.map(x => ({label: x.label, parts: {Kept: x.kept, 'Lost to declines': x.decl, 'Lost dealers': x.lost}}));

  flow(R, {span = 5} = {}) {

    const rows = [{label: 'SS25', parts: {Grew: f.grew, Flat: f.flat, Declined: f.fell, Lost: f.lost}, fmt: v => plural(v, 'dealer')}, {label: 'SS26', parts: {Grew: f.grew, Flat: f.flat, Declined: f.fell, New: f.neu}, fmt: v => plural(v, 'dealer')}];
    return panel({kind: 'Dealer flow', span, title: `${num(f.lost)} dealers left and ${num(f.neu)} joined, so the active base ${d === 0 ? 'held at' : d > 0 ? 'grew by' : 'shrank by'} ${num(Math.abs(d) || f.act26)}`, sub: `Active dealers in each season by what they did. Grew and Declined mean a move of more than 5% in ${MW()}.`, body: segbars(rows, Object.keys(SC), k => SC[k]) + `<p class="note">SS25: ${num(f.act25)} active. SS26: ${num(f.act26)} active.</p>`});
  },
  mix(R, T, dim, {span = 6, n = 10} = {}) {

    else { const allM = CX.members(R, dim, T), m = allM.slice(0, n), lead = chs[0]; mixAll = allM.length;
      rows = m.map(g => { const p = {}; g.rows.forEach(d => p[d.channel] = (p[d.channel] || 0) + d.v26); return {label: g.label, parts: p, lead: g.v26 ? (p[lead] || 0) / g.v26 : 0, full: g.label}; });
      const hi = rows.slice().sort((a, b) => b.lead - a.lead)[0]; title = `${esc(lead)} is ${pct(T.v26 ? CX.members(R, 'channel', T)[0].v26 / T.v26 : 0, 0)} of SS26 ${MW()}, and its share is highest in ${esc(hi.full)} at ${pct(hi.lead, 0)}`; }
    return panel({kind: 'Channel mix', span, title, sub: dim === 'channel' ? `Share of each season's ${MW()} by channel.` : `SS26 ${MW()} by channel for ${many(rows.length, mixAll, dim)}.`, body: segbars(rows, CH_ORDER.filter(c => chs.includes(c)), chColor)});

  },

/* "all 9 RSMs" when every group is shown, otherwise "the 12 largest ASMs". */
const many = (k, total, dim) => k >= total ? `all ${num(k)} ${esc(dimName(dim))}s` : `the ${num(k)} largest ${esc(dimName(dim))}s`;
const cap1 = t => t[0].toUpperCase() + t.slice(1);
const moreCharts = html => html.trim() ? `<h2 class="more-h">More charts</h2><div class="grid">${html}</div>` : '';

/* ---------- deeper analysis: builders ---------- */
const SIZE_EDGES = () => QTY ? [[0, '<10'], [10, '10–25'], [25, '25–50'], [50, '50–100'], [100, '100–250'], [250, '250–500'], [500, '500–1K'], [1000, '1K–2.5K'], [2500, '2.5K–5K'], [5000, '5K+']]
  : [[0, '<10K'], [1e4, '10–25K'], [2.5e4, '25–50K'], [5e4, '50K–1L'], [1e5, '1–2.5L'], [2.5e5, '2.5–5L'], [5e5, '5–10L'], [1e6, '10–25L'], [2.5e6, '25–50L'], [5e6, '50L+']];
const OUT_BASE = () => QTY ? 50 : 5e4;
Object.assign(CX, {
  decomp(R, dim, T) { return CX.members(R, dim, T).map(g => ({key: g.key, label: g.label, lost: -g.lostV, neu: g.newV, vol: g.vol, rate: g.rate, dv: g.dv, v26: g.v26, v25: g.v25})); },
  bandFlow(R) { const L = ['Nil', ...BANDS.map(b => b[1])], m = {}; R.forEach(d => { const k = d.b25 + '|' + d.b26; m[k] = (m[k] || 0) + 1; }); return {L, m, n: R.length}; },
  sizeDist(R) { const E = SIZE_EDGES(), bin = v => { let j = -1; E.forEach(([t], i) => { if (v >= t) j = i; }); return j; };
    return E.map(([, label], i) => ({label, a: R.filter(d => d.v25 > 0 && bin(d.v25) === i).length, b: R.filter(d => d.v26 > 0 && bin(d.v26) === i).length})); },
  sizeGrowth(R) { const c = R.filter(d => d.status === 'Continuing').sort((x, y) => x.v25 - y.v25 || x.v26 - y.v26), n = c.length, out = [];
    for (let i = 0; i < 10; i++) { const g = c.slice(Math.floor(n * i / 10), Math.floor(n * (i + 1) / 10)); if (!g.length) continue;
      const gs = g.map(d => d.g).sort((x, y) => x - y), s25 = g.reduce((p, d) => p + d.v25, 0), s26 = g.reduce((p, d) => p + d.v26, 0);
      out.push({label: `D${i + 1}`, n: g.length, lo: g[0].v25, hi: g[g.length - 1].v25, pooled: s26 / s25 - 1, med: quant(gs, .5), q25: quant(gs, .25), q75: quant(gs, .75), grew: g.filter(d => d.g > 0).length / g.length}); }
    return out; },
  outliers(R) { const base = OUT_BASE(), c = R.filter(d => d.status === 'Continuing' && d.v25 >= base).map(d => ({d, lr: Math.log(d.v26 / d.v25)}));
    if (c.length < 10) return null; const s = c.map(x => x.lr).sort((a, b) => a - b), m = quant(s, .5), mad = quant(c.map(x => Math.abs(x.lr - m)).sort((a, b) => a - b), .5), sig = 1.4826 * mad;
    if (!(sig > 0)) return null; c.forEach(x => x.z = (x.lr - m) / sig);
    return {base, m, sig, pts: c, out: c.filter(x => Math.abs(x.z) >= 3).sort((a, b) => Math.abs(b.z) - Math.abs(a.z)), skipped: R.filter(d => d.status === 'Continuing').length - c.length}; },
  movers(R) { const gains = R.filter(d => d.dv > 0).map(d => d.dv), losses = R.filter(d => d.dv < 0).map(d => -d.dv); return {gains, losses, G: gains.reduce((s, v) => s + v, 0), L: losses.reduce((s, v) => s + v, 0)}; },
  kpis() { return [['Growth', g => g.g, v => sPct(v), 1], ['LFL growth', g => g.lfl, v => sPct(v), 1], ['Dealer retention', g => g.logo, v => pct(v, 0), 1], ['GRR', g => g.grr, v => pct(v, 0), 1],
    [`${QTY ? 'Qty' : 'Value'} per dealer`, g => g.perDealer, v => cfmt(v), 1], ['ASP SS26', g => g.a26, v => '₹' + num(v), 1], ['ASP change', g => g.da, v => sPct(v), 1],
    ['New dealer share', g => g.v26 > 0 ? g.newV / g.v26 : null, v => pct(v, 0), 0], ['Largest dealer', g => g.topShare, v => pct(v, 0), -1]]; },
  corr(R, dim, T) { const m = CX.members(R, dim, T).filter(g => g.v25 > 0 && g.v26 > 0); if (m.length < 6) return null;
    const K = [['Size', g => g.v26], ...CX.kpis().map(k => [k[0], k[1]])], M = K.map(() => K.map(() => null));
    K.forEach((a, i) => K.forEach((b, j) => { const pr = m.map(g => [a[1](g), b[1](g)]).filter(p => p[0] != null && p[1] != null && isFinite(p[0]) && isFinite(p[1]));
      const r = i === j ? 1 : pr.length >= 6 ? spearman(pr.map(p => p[0]), pr.map(p => p[1])) : null; M[i][j] = r != null && isFinite(r) ? r : null; }));
    return {labels: K.map(k => k[0]), M, n: m.length}; },
  depend(R, dim, T) { return CX.members(R, dim, T).filter(g => g.v26 > 0).map(g => { const a = g.rows.map(d => d.v26).filter(v => v > 0).sort((x, y) => y - x); let c = 0, k = 0; while (k < a.length && c / g.v26 < .5 - 1e-12) c += a[k++];
    return {key: g.key, label: g.label, top: g.topShare, topName: g.topName, to50: k, act: a.length, v26: g.v26}; }); },
});

/* ---------- deeper analysis: charts ---------- */

    return panel({kind: 'Gains vs losses curve', span, title: `Gross gains of ${money(m.G)} and gross losses of ${money(m.L)} net to ${sMoney(m.G - m.L)}`, sub: `How concentrated the moves are. Each curve adds dealers from the largest move down. Gains include new dealers and losses include lost dealers.`, body: `<div class="legend"><span><i style="background:var(--gain)"></i>Gains, ${plural(m.gains.length, 'dealer')}</span><span><i style="background:var(--loss)"></i>Losses, ${plural(m.losses.length, 'dealer')}</span></div>` + chart(w => dualCum(w, m.gains, m.losses))}); },
  kpi(R, T, dim, {span = 12, n = 12} = {}) { const allM = CX.members(R, dim, T), m = allM.slice(0, n); if (m.length < 2) return ''; const K = CX.kpis();
    const score = m.map(g => { const ps = K.filter(k => k[3]).map(([, f, , dir]) => { const v = m.map(f).filter(x => x != null && isFinite(x)).sort((a, b) => a - b), x = f(g); if (x == null || !isFinite(x) || v.length < 2) return null; const p = (v.filter(y => y < x).length + (v.filter(y => y === x).length - 1) / 2) / (v.length - 1); return dir > 0 ? p : 1 - p; }).filter(p => p != null); return {g, s: ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null}; }).filter(x => x.s != null).sort((a, b) => b.s - a.s);
    return panel({kind: 'Benchmark grid', span, title: score.length > 1 ? `${esc(score[0].g.label)} ranks best across the measures and ${esc(score[score.length - 1].g.label)} ranks last` : 'Benchmark grid', sub: `${cap1(many(m.length, allM.length, dim))}. Colour is the percentile against the others shown: blue is better, red is worse. A smaller largest-dealer share counts as better. New dealer share is not coloured. Ranking averages the coloured measures with equal weights.`, body: kpiGrid(m, K, {dim})}); },
  corr(R, T, dim, {span = 12} = {}) { const c = CX.corr(R, dim, T); if (!c) return ''; let best = null;

  depend(R, T, dim, {span = 5, n = 12} = {}) { const allD = CX.depend(R, dim, T), d = allD.slice(0, n).sort((a, b) => b.top - a.top); if (!d.length) return ''; const t = d[0];
    return panel({kind: 'Single-dealer dependency', span, title: `In ${esc(t.label)}, one dealer books ${pct(t.top, 0)} of SS26 ${MW()}`, sub: `Share of SS26 ${MW()} from the single largest dealer, for ${many(d.length, allD.length, dim)}. Hover for the dealer and how many dealers make half.`, body: chart(w => hbars(w, d.map(r => ({key: r.key, label: r.label, v: r.top, vt: pct(r.top, 0), c: r.top >= .5 ? 'var(--loss)' : r.top >= .25 ? 'var(--c4)' : 'var(--s26)', tip: [r.label, `Largest: ${r.topName}, ${pct(r.top)}`, `${plural(r.to50, 'dealer')} of ${num(r.act)} make half`]})), {dim})),

function renderCharts(R, T, K) {
  const dim = state.cd, n = state.cn || Infinity, mw = MW();
  const vital = (v, t, s) => `<div class="vital"><b>${v}</b><span>${t}</span><small>${s}</small></div>`;
  const ctl = `<div class="row ctlbar"><div class="ctl"><span>Measure</span><div class="seg" role="group" aria-label="Measure">${[['q', 'Qty'], ['v', 'Value ₹']].map(([k, l]) => `<button type="button" data-cm="${k}" aria-pressed="${state.cm === k}">${l}</button>`).join('')}</div></div>
    <label>Break down by<select id="cd">${DIMS.map(([k, l]) => `<option value="${k}" ${dim === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label>Show<select id="cn">${[5, 8, 12, 20, 30, 0].map(v => `<option value="${v}" ${state.cn === v ? 'selected' : ''}>${v ? 'Top ' + v : 'All'}</option>`).join('')}</select></label></div>`;
  const b1 = [{label: `SS25 ${mw}`, v: T.v25, total: 1, tip: `${num(T.act25)} active dealers`}, {label: `Lost dealers (${num(T.lost)})`, v: -T.lostV, tip: 'Booked SS25, no SS26 booking'}, {label: `Declining dealers (${num(T.dn)})`, v: T.dnV, tip: `Booked both seasons, ${mw} fell`}, {label: `Growing dealers (${num(T.up)})`, v: T.upV, tip: `Booked both seasons, ${mw} rose`}, {label: `New dealers (${num(T.neu)})`, v: T.newV, tip: 'Booked SS26 only'}, {label: `SS26 ${mw}`, v: T.v26, total: 1, tip: `${num(T.act26)} active dealers`}];
  const vitals = `<div class="vitals">

  return secHead('Charts', `Key charts in one place. Choose the measure and the breakdown. The filters above apply to every chart.`) + ctl + `<h2 class="more-h" style="margin-top:0;padding-top:0;border-top:0">Headline numbers</h2>` + vitals
    + sec('Where the change came from', `
    ${panel({kind: 'Bridge chart', span: 7, title: `Lost dealers took ${money(T.lostV)} and new dealers added ${money(T.newV)}. Net change ${sMoney(T.dv)}`, sub: `${mw[0].toUpperCase() + mw.slice(1)} bridge from SS25 to SS26 by dealer status. Hover a bar for the definition.`, body: chart(w => bridge(w, b1)), twin: {cols: [C.text('Step', 'label'), C.lakh(QTY ? 'Qty' : 'Value ₹ L', 'v')], rows: b1}})}

    + sec('Structure and concentration', `
    ${P.treemap(R, T, dim)}

    ${P.mekko(R, T, dim, {n})}

    ${P.slope(R, T, dim, {n})}
    ${P.heat(R, T, dim, {n})}`)

    ${P.asp(R, dim, {n})}

function extrasFor(s, R, T) {
  if (s === 'dealers') return moreCharts(P.pareto(R, {span: 7}) + P.growthDist(R));
  if (s === 'team') return moreCharts(P.treemap(R, T, 'asm') + P.slope(R, T, 'rsm', {n: 12}));
  if (s === 'geo') return moreCharts(P.treemap(R, T, 'state') + P.slope(R, T, 'state', {n: 12}));
  if (s === 'price') return moreCharts(P.asp(R, 'channel') + P.mix(R, T, 'rsm'));
  if (s === 'retention') return moreCharts(P.flow(R) + P.bandKeep(R));
  if (s === 'actions') { const win = listsFor(R).win; if (!win.length) return '';
    const byR = [...groupBy(win, 'rsm')].map(([k, g]) => ({key: k, label: k, v: g.reduce((p, d) => p + d.v25, 0), n: g.length})).sort((a, b) => b.v - a.v), pool = byR.reduce((p, r) => p + r.v, 0);
    return moreCharts(P.pareto(win, {span: 7, vals: win.map(d => d.v25), unit: 'lost dealers', title: (k, n2, Tw) => `${num(k)} of ${num(n2)} lost trade dealers hold 80% of the win-back pool of ${money(Tw)}`, sub: `Running share of SS25 ${MW()} from trade dealers that did not rebook, largest first.`})
      + panel({kind: 'Win-back pool by RSM', span: 5, title: `${esc(byR[0].label)} has the largest win-back pool at ${money(byR[0].v)}, ${pct(byR[0].v / pool, 0)} of the total`, sub: 'SS25 qty from lost trade dealers, by RSM. Select a bar to filter.', body: chart(w => hbars(w, byR.map(r => ({key: r.key, label: r.label, v: r.v, c: 'var(--loss)', tip: [r.label, `${money(r.v)} from ${plural(r.n, 'lost dealer')}`, `${pct(r.v / pool)} of the pool`]})), {dim: 'rsm'}))})); }
  if (s === 'all') { const rows = allRows(R); if (!rows.length) return ''; return moreCharts(P.treemap(rows, roll(rows), 'rsm') + P.growthDist(rows, {what: 'dealers shown'})); }
  return '';
}

  else if (both) headline = `Bookings ${verb(T.dv)} ${pct(Math.abs(T.g))} to ${money(T.v26)}. Trade dealers ${verb(tr.dv)} ${pct(Math.abs(tr.g))} and company shops ${verb(co.dv)} ${pct(Math.abs(co.g ?? 0))}.`;

    {label: 'Value per dealer', a: money(T.act25 ? T.v25 / T.act25 : null), b: money(T.perDealer), c: T.act25 && T.perDealer ? T.perDealer / (T.v25 / T.act25) - 1 : null},

  </div>`;
  const b1 = [{label: 'SS25 value', v: T.v25, total: 1, tip: `${num(T.act25)} active dealers`}, {label: `Lost dealers (${num(T.lost)})`, v: -T.lostV, tip: 'Booked SS25, no SS26 booking'}, {label: `Declining dealers (${num(T.dn)})`, v: T.dnV, tip: 'Booked both seasons, value fell'}, {label: `Growing dealers (${num(T.up)})`, v: T.upV, tip: 'Booked both seasons, value rose'}, {label: `New dealers (${num(T.neu)})`, v: T.newV, tip: 'Booked SS26 only'}, {label: 'SS26 value', v: T.v26, total: 1, tip: `${num(T.act26)} active dealers`}];
  const b2 = [{label: 'SS25 value', v: T.v25, total: 1}, {label: 'Lost dealers', v: -T.lostV}, {label: 'New dealers', v: T.newV}, {label: 'LFL volume effect', v: T.vol, tip: '(SS26 qty − SS25 qty) × SS25 ASP, per dealer'}, {label: 'LFL rate effect', v: T.rate, tip: '(SS26 ASP − SS25 ASP) × SS26 qty, per dealer'}, {label: 'SS26 value', v: T.v26, total: 1}];

  const chs = rollup(R, 'channel', T);

function renderDealers(R, T, K) {
  const by = {v26: ['SS26 qty', d => d.v26], v25: ['SS25 qty', d => d.v25], gain: ['Largest qty gain', d => d.dv], loss: ['Largest qty loss', d => -d.dv], gp: ['Highest growth % (SS25 ≥ 100 mtrs)', d => d.v25 >= 100 && d.v26 > 0 ? d.g : null], hi: ['Highest ASP (SS26 qty ≥ 50)', d => d.q26 >= 50 ? d.a26 : null], lo: ['Lowest ASP (SS26 qty ≥ 50)', d => d.q26 >= 50 ? -d.a26 : null]};
  if (!by[state.topBy]) state.topBy = 'v26';
  const [byName, score] = by[state.topBy];
  const ranked = R.map(d => [d, score(d)]).filter(x => x[1] != null && x[1] > 0).sort((a, b) => b[1] - a[1]);

    ${panel({kind: 'Reconciliation', span: 5, title: 'Dashboard totals match the source file exactly', sub: `Source: ${B().file}, ${B().recon}. Comparison uses the unfiltered data.`, body: table({cols: [C.text('Measure', 'label', {nosort: 1}), {h: 'Source', n: 1, v: r => r.source, f: x => num(x, 2), nosort: 1}, {h: 'Dashboard', n: 1, v: r => r.model, f: x => num(x, 2), nosort: 1}, {h: 'Difference', n: 1, v: r => Math.round((r.model - r.source) * 100) / 100, f: x => num(x, 2), nosort: 1}], rows: rec})})}
    ${panel({kind: 'Possible recodes', span: 7, title: `${P.mirror.length} possible recodes were left apart. ${P.mirror.reduce((s, m) => s + m.lost_value, 0) < .25 * all.lostV ? 'They do not explain the dealer turnover' : 'They could explain part of the dealer turnover'}`, sub: `Same name and city, with one code Lost and another New. Total ${money(P.mirror.reduce((s, m) => s + m.lost_value, 0))} lost and ${money(P.mirror.reduce((s, m) => s + m.new_value, 0))} new, against ${money(all.lostV)} and ${money(all.newV)} overall.`, body: table({cols: [C.text('Dealer', 'name', {nosort: 1}), C.text('City', 'city', {nosort: 1}), C.text('Lost code', 'lost_codes', {nosort: 1}), C.text('New codes', 'new_codes', {nosort: 1}), {h: 'Lost', n: 1, v: r => r.lost_value, f: x => money(x), nosort: 1}, {h: 'New', n: 1, v: r => r.new_value, f: x => money(x), nosort: 1}], rows: P.mirror})})}
    ${panel({kind: 'Identical values', span: 7, title: `${P.same.length} identical-value cases need a check before these totals go further`, sub: 'Same booking value on similar names under different codes. Left in totals. These could be one order split or copied across codes.', body: table({cols: [{h: 'Dealers', v: r => r.dealers, wrap: 1, nosort: 1}, C.text('Season', 'season', {nosort: 1}), {h: 'Value per row', n: 1, v: r => r.value, f: x => money(x), nosort: 1}, {h: 'Above one row', n: 1, v: r => r.excess, f: x => money(x), nosort: 1}], rows: P.same})})}
    ${!P.pairs.length ? '' : panel({kind: 'Combined codes', span: 5, title: `${word(pairCodes.length)} dealers were combined because they share one S4HANA code`, sub: splitCodes ? `Without this, ${word(splitCodes).toLowerCase()} of them would count as one lost dealer plus one new dealer.` : 'Each code keeps its full history in one dealer.', body: table({cols: [C.text('S4HANA code', 's4', {nosort: 1}), C.text(B().pairId, 'buyer', {nosort: 1}), C.text('Name', 'name', {nosort: 1}), {h: 'SS25', n: 1, v: r => r.v25, f: x => money(x), nosort: 1}, {h: 'SS26', n: 1, v: r => r.v26, f: x => money(x), nosort: 1}], rows: P.pairs})})}
    ${panel({kind: 'Source issues', title: 'Other source issues and how they were treated', body: table({cols: [{h: 'Issue', v: r => r[0], wrap: 1, nosort: 1}, {h: 'Treatment', v: r => r[1], wrap: 1, nosort: 1}], rows: P.issues})})}
    ${panel({kind: 'Definitions', title: 'Definitions', body: `<dl class="dl">${defs.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`})}
  </div>`;
}

/* ---------- shell ---------- */
function renderFilters(R, T) {
  const form = document.getElementById('filters');
  const labels = {};
  const opts = k => {
    if (k === 'scope') return [['all', 'All dealers'], ['trade', 'Trade only'], ['coco', 'Company shops only']];
    const set = new Set(DEALERS.filter(d => pass(d, k)).map(d => d[k]));
    return [['', 'All'], ...[...set].sort((a, b) => typeof a === 'number' ? a - b : String(a).localeCompare(String(b))).map(v => [v, labels[k] ? labels[k](v) : v])];
  };
  const active = FILTERS.some(([k]) => k === 'scope' ? state.f.scope !== 'all' : state.f[k]);
  form.innerHTML = FILTERS.map(([k, l]) => `<label>${l}<select data-f="${k}" class="${(k === 'scope' ? state.f.scope !== 'all' : state.f[k]) ? 'on' : ''}">${opts(k).map(([v, t]) => `<option value="${esc(v)}" ${String(state.f[k]) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`).join('') + (active ? `<button type="button" class="reset" id="reset">Reset filters</button>` : '') + `<div class="scope" role="status"><b>${num(T.n)}</b> dealer${T.n === 1 ? '' : 's'}, <b>${money(T.v26)}</b> SS26</div>`;
  form.querySelectorAll('select').forEach(s => s.onchange = () => { state.f[s.dataset.f] = s.value; const keep = document.activeElement?.dataset?.f; render(); if (keep) document.querySelector(`[data-f="${keep}"]`)?.focus(); });
  const rs = form.querySelector('#reset'); if (rs) rs.onclick = () => { state.f = {scope: 'all', nh: '', zm: '', rsm: '', asm: '', channel: '', state: '', sg: ''}; render(); };
}
function renderNav() {
  document.getElementById('nav').innerHTML = SECTIONS.map(([k, l]) => `<button type="button" data-sec="${k}" ${state.section === k ? 'aria-current="page"' : ''}>${esc(l)}</button>`).join('');
  document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => go(b.dataset.sec));
}
function render() {
  charts.clear(); tables.clear(); uid = 0;
  QTY = state.section === 'charts' ? state.cm === 'q' : state.section !== 'summary' && state.section !== 'notes'; BANDS = QTY ? QBANDS : VBANDS;
  const R = view(), T = roll(R), K = concentration(R);
  renderNav(); renderFilters(R, T);
  const el = document.getElementById('content');
  if (!R.length && state.section !== 'notes') { el.innerHTML = `<div class="empty">No dealers match these filters. Select Reset filters to see all dealers.</div>`; return; }
  const s = state.section;
  el.innerHTML = s === 'summary' ? renderSummary(R, T, K) : s === 'charts' ? renderCharts(R, T, K) : s === 'dealers' ? renderDealers(R, T, K) : s === 'team' ? renderTeam(R, T) : s === 'geo' ? renderGeo(R, T) : s === 'price' ? renderPrice(R, T) : s === 'retention' ? renderRetention(R, T) : s === 'actions' ? renderActions(R, T) : s === 'all' ? renderAll(R) : renderNotes(T);
  el.insertAdjacentHTML('beforeend', extrasFor(s, R, T));
  el.insertAdjacentHTML('beforeend', `<p class="source">Source: ${B().file}, ${num(B().rows)} rows, ${num(DEALERS.length)} dealers after combining shared S4HANA codes. ${QTY ? 'This page compares booking qty in mtrs. Summary shows value in ₹ by assumption.' : 'Value shown in ₹ by assumption.'} Built 5 November 2026, qty view added 11 November 2026.</p>`);
  mount(); wire();
  window.__metrics = {T, K, section: s};
}
function wire() {
  const on = (id, fn) => { const e = document.getElementById(id); if (e) fn(e); };
  on('topN', e => e.onchange = () => { state.topN = +e.value; render(); });
  on('topBy', e => e.onchange = () => { state.topBy = e.value; render(); });
  on('cityN', e => e.onchange = () => { state.cityN = +e.value; render(); });
  on('cd', e => e.onchange = () => { state.cd = e.value; render(); });
  on('cn', e => e.onchange = () => { state.cn = +e.value; render(); });
  document.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => { state.cm = b.dataset.cm; render(); });
  on('st', e => e.onchange = () => { state.st = e.value; render(); });
  on('q', e => e.oninput = () => { state.q = e.value; const pos = e.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
  document.querySelectorAll('[data-heat]').forEach(b => b.onclick = () => { state.heatM = b.dataset.heat; render(); });
  document.querySelectorAll('[data-listtab]').forEach(b => b.onclick = () => { state.list = b.dataset.listtab; render(); });
  document.querySelectorAll('[data-list]').forEach(b => b.onclick = () => { state.list = b.dataset.list; go('actions'); });
  document.querySelectorAll('[data-lv]').forEach(i => { i.onchange = () => { state.lv[i.dataset.lv] = +i.value; render(); }; i.oninput = () => { const o = document.getElementById('lv-' + i.dataset.lv); if (o) o.textContent = i.value + '%'; }; });
  document.querySelectorAll('[data-th]').forEach(i => i.onchange = () => { const v = +i.value; if (!isFinite(v) || v < 0) return; const tgt = QTY && i.dataset.th in state.qth ? state.qth : state; tgt[i.dataset.th] = i.dataset.pct ? v / 100 : v; render(); });
  document.querySelectorAll('[data-twin]').forEach(b => b.onclick = () => { const p = b.dataset.twin, a = document.getElementById(p + 'a'), t = document.getElementById(p + 'b'); const showTable = t.hidden; t.hidden = !showTable; a.hidden = showTable; b.textContent = showTable ? 'Show chart' : 'Show table'; b.setAttribute('aria-expanded', String(showTable)); if (!showTable) mount(); });
}
document.addEventListener('click', e => { const t = e.target.closest('[data-drill]'); if (t) { const [k, v] = t.dataset.drill.split('|'); if (v) { state.f[k] = String(state.f[k]) === String(v) ? '' : v; render(); } } });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-drill]')) { e.preventDefault(); e.target.click(); } });
/* Chart help: hover opens it on a laptop, a tap opens and closes it on a phone. */
const closeHelp = keep => document.querySelectorAll('.hw.open').forEach(w => { if (w !== keep) { w.classList.remove('open'); w.querySelector('.help').setAttribute('aria-expanded', 'false'); } });
document.addEventListener('click', e => { const b = e.target.closest?.('.help'); if (b) { e.preventDefault(); const w = b.parentElement, on = !w.classList.contains('open'); closeHelp(w); w.classList.toggle('open', on); b.setAttribute('aria-expanded', String(on)); return; } if (!e.target.closest?.('.hp')) closeHelp(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHelp(); });
const tip = document.getElementById('tip');
function showTip(t, x, y) { const lines = t.dataset.tip.split('|').filter(Boolean); tip.textContent = ''; lines.forEach((l, i) => { const n = document.createElement(i ? 'div' : 'b'); n.textContent = l; tip.appendChild(n); }); tip.style.display = 'block'; const r = tip.getBoundingClientRect(); tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + 'px'; tip.style.top = (y + r.height + 20 > innerHeight ? y - r.height - 10 : y + 14) + 'px'; }
document.addEventListener('mousemove', e => { const t = e.target.closest?.('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else tip.style.display = 'none'; });
document.addEventListener('focusin', e => { const t = e.target.closest?.('[data-tip]'); if (t) { const r = t.getBoundingClientRect(); showTip(t, r.right, r.top); } });
document.addEventListener('focusout', () => { tip.style.display = 'none'; });
document.addEventListener('touchstart', e => { const t = e.target.closest?.('[data-tip]'), p = e.touches[0]; if (t && p) showTip(t, p.clientX, p.clientY); else tip.style.display = 'none'; }, {passive: true});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => document.querySelectorAll('[data-c]').forEach(el => { const w = el.clientWidth; if (w > 0) el.innerHTML = charts.get(el.dataset.c)(w); }) || fitSegLabels(), 120); });
document.title = 'Suiting bookings: SS26 against SS25';
const themeBtn = document.getElementById('theme');
const isDark = () => { const a = document.documentElement.dataset.theme; return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const labelTheme = () => themeBtn.textContent = isDark() ? 'Switch to light theme' : 'Switch to dark theme';
themeBtn.onclick = () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('suiting-theme', next); } catch (e) {} labelTheme(); render(); };
try { const s = localStorage.getItem('suiting-theme'); if (s) document.documentElement.dataset.theme = s; } catch (e) {}
labelTheme();
document.getElementById('print').onclick = () => window.print();
const hashSec = (location.hash || '').slice(1); if (SECTIONS.some(s => s[0] === hashSec)) state.section = hashSec;
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (SECTIONS.some(s => s[0] === h) && h !== state.section) { state.section = h; render(); } });
render();
document.fonts?.ready.then(() => render());

</script>
